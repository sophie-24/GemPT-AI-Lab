apiVersion: v1
kind: Namespace
metadata:
  name: gempt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gempt-config
  namespace: gempt
data:
  MCP_SERVER_URL: http://mcp-tools:8000/mcp
  PROJECT_DB_FILE: /data/project_db.json
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gempt-project-data
  namespace: gempt
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tools
  namespace: gempt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-tools
  template:
    metadata:
      labels:
        app: mcp-tools
    spec:
      containers:
        - name: mcp-tools
          image: gempt-mcp-tools:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tools
  namespace: gempt
spec:
  type: ClusterIP
  selector:
    app: mcp-tools
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: gempt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: gempt-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: gempt-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gempt-api-keys
                  key: OPENAI_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gempt-api-keys
                  key: GOOGLE_API_KEY
                  optional: true
            - name: SERPAPI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gempt-api-keys
                  key: SERPAPI_API_KEY
                  optional: true
          volumeMounts:
            - name: project-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: project-data
          persistentVolumeClaim:
            claimName: gempt-project-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: gempt
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 5000
      targetPort: http
